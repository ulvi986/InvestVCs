# Render blueprint for the analyst service.
#
# The frontend goes to Vercel; this is the other half. It has to be an
# always-on web service rather than anything serverless, because a run holds
# an SSE stream open for minutes and keeps its state in process.
#
# Import this file in Render: New -> Blueprint -> point at this repository.
# The secrets are marked sync:false, so Render prompts for them instead of
# reading them from the repo.

services:
  - type: web
    name: investvcs-analyst
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: starter          # Free instances sleep, which drops a running analysis.
    region: frankfurt
    healthCheckPath: /health

    # One instance only. Run state is in process, so an approval must reach the
    # same instance that is streaming the run.
    numInstances: 1

    envVars:
      # Two surfaces are supported and the endpoint decides which:
      #
      #   AZURE_OPENAI_ENDPOINT      https://<resource> - the deployment
      #                              surface. AZURE_AI_MODEL names the
      #                              deployment, so the model is chosen here.
      #   AZURE_AI_FOUNDRY_ENDPOINT  a Foundry agent URL ending in /responses.
      #                              The agent is pinned to its own model and
      #                              the service sends none.
      #
      # AZURE_OPENAI_ENDPOINT wins when both are set. gpt-6-astra is only
      # servable on the deployment surface: through an agent it returns 500.
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_AI_FOUNDRY_ENDPOINT
        sync: false
      - key: AZURE_AI_API_KEY
        sync: false
      # The deployment to call, on the deployment surface. Ignored on a
      # Foundry agent endpoint, where the agent's own model is what runs -
      # which is how this deploys today.
      - key: AZURE_AI_MODEL
        sync: false
      # Version per surface, and they are not interchangeable: the agent
      # endpoint takes 2025-11-15-preview and the deployment surface 404s it;
      # the deployment surface takes 2024-10-21 and the agent endpoint 404s it.
      - key: AZURE_OPENAI_API_VERSION
        value: 2025-11-15-preview

      # The browser calls this service directly, so the Vercel domain has to be
      # allowed. Set it once the frontend has a URL; "*" only while testing.
      - key: CORS_ORIGINS
        sync: false

      # Real model, not canned output. Fails loudly if credentials are missing
      # rather than quietly serving illustrative numbers.
      - key: AI_MOCK
        value: "0"

      # The deployment's rate limit, not the orchestrator, caps throughput.
      # claude-fable-5 has capacity 1000 against gpt-5-mini's 50, so this can
      # be generous; on a small deployment drop it to 2.
      - key: AGENT_CONCURRENCY
        value: "6"

      # A single agent call takes 70-105s on claude-fable-5 and up to 190s on
      # gpt-6-astra. The default 120 cut runs off mid-call.
      - key: LLM_TIMEOUT_SECONDS
        value: "300"
