# Build config for the Python analyst service.
#
# This file and ai/railway.json only apply when the Railway service's Root
# Directory is set to `ai`. Without that, Railway reads the repository root
# instead, finds the Node config there, and tries to start the frontend from
# this service.
[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
